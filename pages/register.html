<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato | Register</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">Tomato 🍅</div>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/pages/order.html">Order</a></li>
          <li><a href="/pages/stores.html">All Stores</a></li>
          <li><a href="/pages/status.html">Delivery Status</a></li>
          <li><a href="/pages/checkout.html">Checkout</a></li>
          <li><a href="/pages/login.html">Login</a></li>
        </ul>
      </nav>
    </header>

    <main class="auth-container">
      <h2>Create a New Account</h2>
      <form class="auth-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter a strong password"
          required
        />

        <button type="submit">Register</button>
        <p>Already have an account? <a href="/pages/login.html">Login</a></p>
      </form>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-logo">Tomato 🍅</div>
        <p>&copy; 2025 Tomato. All rights reserved.</p>
        <ul class="footer-links">
          <li><a href="/pages/about.html">About</a></li>
          <li><a href="/pages/contact.html">Contact</a></li>
          <li><a href="/pages/login.html">Login</a></li>
          <li><a href="/pages/checkout.html">Checkout</a></li>
          <li><a href="/pages/material.html">Material</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
